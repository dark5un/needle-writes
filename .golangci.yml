version: "2"
run:
  build-tags:
    - live
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - gosec
    - errorlint
    - copyloopvar
    - nilerr
    - noctx
    - makezero
  settings:
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
