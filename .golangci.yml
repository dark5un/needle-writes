version: "2"
run:
  build-tags:
    - live
linters:
  default: standard
  exclusions:
    # Generated protocol bindings carry the canonical "Code generated"
    # header; their scanner quirks (dead stores) are not our audit surface.
    generated: strict
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - gosec
    - errorlint
    - copyloopvar
    - nilerr
    - noctx
    - makezero
  settings:
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
